<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 8: Dashboard with CSS Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #eef2f9;
      padding: 20px;
    }

    /* 8.1 & 8.3: Main Grid Layout with grid-template-areas */
    .dashboard-container {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "head head"
        "side main"
        "foot foot";
      gap: 15px;
      min-height: 90vh;
    }

    /* Header Area */
    .header {
      grid-area: head;
      background-color: #111d38;
      color: white;
      padding: 25px 20px;
      border-radius: 6px;
    }

    .header h1 {
      font-size: 1.5rem;
    }

    /* Sidebar Area */
    .sidebar {
      grid-area: side;
      background-color: #dbe4ff;
      padding: 20px;
      border-radius: 6px;
      color: #111d38;
    }

    .sidebar h3 {
      margin-bottom: 15px;
    }

    .sidebar ul {
      list-style-type: disc;
      padding-left: 20px;
    }

    .sidebar li {
      margin-bottom: 8px;
    }

    .sidebar a {
      color: #111d38;
      text-decoration: none;
      font-weight: 500;
    }

    /* Main Content Area */
    .main-content {
      grid-area: main;
      /* 8.2: Grid inside main area with repeat, auto-fit, minmax, and fr */
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      align-content: start;
    }

    /* 8.4: Box styling with Flexbox for layout */
    .card {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 15px;
      /* Flexbox to put icon and text side-by-side */
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .card .icon {
      font-size: 2rem;
    }

    .card-info {
      display: flex;
      flex-direction: column;
    }

    .card-info strong {
      font-size: 1.1rem;
      color: #111d38;
    }

    .card-info span {
      font-size: 0.85rem;
      color: #666;
    }

    /* Footer Area */
    .footer {
      grid-area: foot;
      background-color: #111d38;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- Header Area -->
    <header class="header">
      <h1>My Dashboard</h1>
    </header>

    <!-- Side Menu Area -->
    <aside class="sidebar">
      <h3>Menu</h3>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Reports</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="card">
        <span class="icon">👤</span>
        <div class="card-info">
          <strong>120</strong>
          <span>Users</span>
        </div>
      </div>

      <div class="card">
        <span class="icon">💰</span>
        <div class="card-info">
          <strong>Rs 45k</strong>
          <span>Sales</span>
        </div>
      </div>

      <div class="card">
        <span class="icon">📦</span>
        <div class="card-info">
          <strong>36</strong>
          <span>Orders</span>
        </div>
      </div>

      <div class="card">
        <span class="icon">⭐</span>
        <div class="card-info">
          <strong>4.8</strong>
          <span>Rating</span>
        </div>
      </div>

      <div class="card">
        <span class="icon">💬</span>
        <div class="card-info">
          <strong>18</strong>
          <span>Messages</span>
        </div>
      </div>

      <div class="card">
        <span class="icon">✅</span>
        <div class="card-info">
          <strong>92%</strong>
          <span>Done</span>
        </div>
      </div>
    </main>

    <!-- Footer Area -->
    <footer class="footer">
      <p>Made with CSS Grid</p>
    </footer>
  </div>

</body>
</html>
