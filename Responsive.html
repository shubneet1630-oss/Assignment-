<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelEase</title>
  <style>
    /* --- RESET & MOBILE BASE STYLES --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f5f7;
      color: #ffffff;
    }

    img {
      max-width: 100%;
    }

    /* --- NAVBAR (Flexbox) --- */
    .navbar {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #0d1b2a;
      padding: 1rem;
      gap: 0.5rem;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
    }

    .nav-links a {
      color: #e0e1dd;
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* --- MAIN PAGE GRID --- */
    .page-container {
      display: grid;
      grid-template-columns: 1fr;
    }

    /* Hero Section */
    .hero {
      background-color: #2563eb;
      text-align: center;
      padding: 2.5rem 1rem;
    }

    .hero h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .hero-img {
      background-color: #93c5fd;
      color: #1e3a8a;
      height: 180px;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 6px;
      margin: 0 auto;
    }

    /* Features Section (Grid) */
    .features {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      padding: 1.5rem;
    }

    .card {
      background-color: #ffffff;
      color: #1f2937;
      padding: 1.25rem;
      border-radius: 6px;
      text-align: center;
    }

    .card h3 {
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }

    .card p {
      font-size: 0.85rem;
      color: #6b7280;
    }

    /* --- MEDIA QUERIES --- */

    /* Tablet View (768px) */
    @media (min-width: 768px) {
      .hero h1 {
        font-size: 1.85rem;
      }
      
      .hero-img {
        height: 220px;
        max-width: 80%;
      }

      .features {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Desktop View (1024px) */
    @media (min-width: 1024px) {
      .navbar {
        flex-direction: row;
        justify-content: space-between;
        padding: 1rem 3rem;
      }

      .hero h1 {
        font-size: 2.25rem;
      }

      .hero-img {
        height: 260px;
        max-width: 600px;
      }

      .features {
        max-width: 900px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar (Flexbox) -->
  <header class="navbar">
    <div class="logo">TravelEase</div>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Trips</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Page Layout (Grid) -->
  <main class="page-container">
    
    <!-- Hero Section -->
    <section class="hero">
      <h1>Plan your next trip in minutes</h1>
      <p>Simple, cheap and fun travel plans.</p>
      <div class="hero-img">img/hero.jpg</div>
    </section>

    <!-- Features Section -->
    <section class="features">
      <div class="card">
        <h3>Easy Booking</h3>
        <p>Book in 3 clicks.</p>
      </div>
      <div class="card">
        <h3>Best Prices</h3>
        <p>Guaranteed low rates.</p>
      </div>
      <div class="card">
        <h3>24x7 Help</h3>
        <p>We are always here.</p>
      </div>
    </section>

  </main>

</body>
</html>
